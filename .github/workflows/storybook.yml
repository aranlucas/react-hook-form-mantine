name: Storybook

# GitHub Pages serves the gh-pages branch: main's Storybook at the root (deployed by the Release
# workflow), and each pull request's at /pr-preview/pr-<number>/. Previews are removed when their
# pull request closes.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Upload Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: storybook-static
          retention-days: 7

  deploy-preview:
    # Fork pull requests get a read-only token, so they can't push a preview.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !cancelled() && (needs.build.result == 'success' || github.event.action == 'closed') && github.event.pull_request.draft != true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Storybook
        if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook
          path: storybook-static
      - name: Deploy or remove the preview
        # Deploys on opened/synchronize/reopened, removes on closed, and keeps a sticky comment
        # with the preview URL on the pull request.
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: storybook-static
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false
          # Post the comment once Pages has published the preview, not just pushed it.
          wait-for-pages-deployment: true
