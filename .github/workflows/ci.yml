name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - parallel:
          - name: Check formatting
            run: pnpm format

          - name: Lint
            run: pnpm lint

          - name: Typecheck
            run: pnpm typecheck

          - name: Test
            run: pnpm test --run

          - name: Build
            run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm exec e2e run
      - name: Upload failure evidence and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: .e2e/
          include-hidden-files: true
          retention-days: 7

  regression-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Demonstrate multiple-file contract rejects the defective adapter
        env:
          BASE_SHA: cda85d0aa180b513341a85d91d9b092283cdff15 # Known defective adapter, even after merge.
        run: |
          git show "$BASE_SHA:src/FileInput/FileInput.tsx" > src/FileInput/FileInput.tsx
          if pnpm exec tsc --noEmit > regression.log 2>&1; then
            cat regression.log
            echo "Expected the pre-fix multiple-file compile contract to fail"
            exit 1
          fi
          cat regression.log
          grep 'controller-contract.types.tsx' regression.log
          grep -E "controller-contract.types.tsx.*Type 'true' is not assignable to type 'false" regression.log
      - name: Upload negative-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-proof
          path: regression.log
