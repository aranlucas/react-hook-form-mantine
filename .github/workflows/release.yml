name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        env:
          # This job holds write tokens, so don't run lifecycle scripts during install.
          pnpm_config_ignore_scripts: "true"
        with:
          cache: true
          require-lockfile: true
      - name: Install Playwright Chromium
        # The storybook test project runs every story in a real browser.
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test --run
          pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Deploy Storybook to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: storybook-static
          branch: gh-pages
          # Leave pull request previews in place.
          clean-exclude: pr-preview/
          force: false
