version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
